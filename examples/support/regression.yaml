# EvalOps example -- OFFLINE, DETERMINISTIC.
#
# `execution.backend: mock` runs the built-in MockProvider for every provider
# identity. Every response / latency_ms below is a SYNTHETIC test value, not
# output from a real language model.
#
# Story: the candidate FIXES a wrong answer (sky colour) -- improving
# exact_match/contains pass rate -- but its p95 latency rises 50% (40 -> 60),
# past the 20% budget. EvalOps BLOCKS the release. `fixed.yaml` trims the
# latency back within budget and the same quality gain then PASSES.

project: "Customer Support QA"

dataset:
  path: "cases.jsonl"
  name: "support"

repeats: 1

execution:
  backend: mock

baseline:
  name: "support-prompt"
  version: "v1"
  provider: "ollama"
  model: "llama3.2"
  prompt_template: |-
    Answer concisely.
    Q: ${input}
    A:
  parameters:
    mock:
      responses:
        "Answer concisely.\nQ: What is the capital of France?\nA:": "Paris"
        "Answer concisely.\nQ: What is 2 + 2?\nA:": "4"
        "Answer concisely.\nQ: Which planet is known as the Red Planet?\nA:": "Mars"
        "Answer concisely.\nQ: What color is a clear daytime sky?\nA:": "grey"
      default: "I don't know."
      latency_ms: 40

candidate:
  name: "support-prompt"
  version: "v2"
  provider: "ollama"
  model: "llama3.2"
  prompt_template: |-
    Answer concisely.
    Q: ${input}
    A:
  parameters:
    mock:
      responses:
        "Answer concisely.\nQ: What is the capital of France?\nA:": "Paris"
        "Answer concisely.\nQ: What is 2 + 2?\nA:": "4"
        "Answer concisely.\nQ: Which planet is known as the Red Planet?\nA:": "Mars"
        "Answer concisely.\nQ: What color is a clear daytime sky?\nA:": "blue"
      default: "I don't know."
      latency_ms: 60

evaluators:
  - type: exact_match
  - type: contains
    case_sensitive: false
  - type: regex_match
    name: non_empty
    pattern: "\\S"

release_policy:
  name: "default"
  thresholds:
    success_rate: 0.0
    exact_match.pass_rate: 0.05
    contains.pass_rate: 0.05
    latency_ms.p95: 0.20
    cost_usd.total: 0.10
  max_safety_violations: 0
