name: Deploy to Azure (production)

# Phase 10, CP 10.5. Manually triggered only -- never on every push to main --
# and gated by the repo's "production" GitHub Environment, which should have a
# required-reviewer protection rule configured (Settings -> Environments).
# Azure auth is OIDC/federated-credential (azure/login@v2, no client secret,
# no stored service-principal password) -- see deploy/azure/README.md for the
# one-time `03-github-oidc.sh` setup this depends on.
#
# Flow: run the same checks CI runs -> (blank image_tag only) build+push
# linux/amd64 images to ACR tagged with the immutable commit SHA (and
# :latest, for convenience; the deploy step below only ever uses the SHA
# tag) -> run the Alembic migration job and require it to succeed -> roll
# api/worker/dashboard forward to that tag -> a bounded post-deploy
# health/smoke check. A failed migration stops the workflow before anything
# is redeployed (see deploy/azure/02-deploy.sh).
#
# A *supplied* image_tag (rollback/redeploy of a known-good tag) skips the
# build entirely -- an immutable tag already in ACR must never be
# overwritten with whatever happens to be checked out right now. The
# `deploy` job verifies the requested tag actually exists in ACR before
# doing anything else in that case.
#
# Existing runtime secrets (DATABASE_URL, EVALOPS_API_KEY, provider keys) are
# never touched here -- they already exist as Container Apps secrets (see
# deploy/azure/README.md's "Adopt an existing deployment" for how they got
# there). This workflow only ever references them by name (`--set-env-vars`,
# `secretref:`), never a value -- and the API key is never fetched into the
# runner at all (see the deploy job's final smoke-check step).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Image tag to deploy. Leave blank to build the checked-out commit and
          deploy it (the normal path); set to an existing ACR tag (e.g. a
          previous commit SHA) to redeploy it WITHOUT rebuilding -- that exact
          tag is deployed as-is, never overwritten.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-azure-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  checks:
    name: pre-deploy checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci
      - working-directory: dashboard
        run: npm run check

  build-and-push:
    name: build + push (${{ matrix.image }})
    needs: checks
    # Only when redeploying the checked-out commit fresh. A supplied image_tag
    # means "deploy this exact, already-pushed tag" -- building now would
    # overwrite it with current source under the same immutable tag.
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OIDC
      contents: read
    strategy:
      matrix:
        include:
          - image: evalops-backend
            context: .
            dockerfile: Dockerfile
          - image: evalops-dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC, no stored credential)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR (via the OIDC-authenticated az session, no admin user)
        run: az acr login --name "${{ vars.ACR_NAME }}"

      # linux/amd64 explicitly: Container Apps requires it, and this must not
      # silently depend on the runner's own default architecture.
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: migrate + deploy
    needs: [checks, build-and-push]
    # build-and-push is intentionally skipped when image_tag is supplied
    # (see its own `if:`) -- this must still run in that case, as long as
    # checks passed and build-and-push didn't *fail* (skipped != failed).
    if: |
      always() &&
      needs.checks.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no stored credential)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Some GitHub-hosted az CLI images ship without the (now largely
      # built-in) containerapp command group preinstalled; a no-op if present.
      - name: Ensure the containerapp CLI extension is available
        run: az extension add --name containerapp --upgrade --only-show-errors -y || true

      # A supplied (not built-this-run) tag must already exist -- refuse to
      # proceed rather than have 02-deploy.sh fail confusingly later, and
      # this never risks overwriting it (nothing pushes in this branch).
      - name: Verify the requested tag already exists in ACR
        if: ${{ inputs.image_tag != '' }}
        run: |
          for img in evalops-backend evalops-dashboard; do
            if ! az acr repository show --name "${{ vars.ACR_NAME }}" \
              --image "$img:${{ env.IMAGE_TAG }}" >/dev/null 2>&1; then
              echo "::error::${img}:${{ env.IMAGE_TAG }} not found in ${{ vars.ACR_NAME }} -- refusing to deploy a non-existent tag"
              exit 1
            fi
          done

      # Only resource NAMES -- never a secret -- flow through this generated
      # file; DATABASE_URL/EVALOPS_API_KEY/provider keys already exist as
      # Container Apps secrets and are referenced by name only, never
      # re-supplied here.
      - name: Write deploy/azure/config.env from repository variables
        working-directory: deploy/azure
        run: |
          cat > config.env <<EOF
          AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION=${{ vars.AZURE_LOCATION }}
          RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME=${{ vars.ACR_NAME }}
          MIGRATE_JOB_NAME=${{ vars.MIGRATE_JOB_NAME }}
          API_APP_NAME=${{ vars.API_APP_NAME }}
          WORKER_APP_NAME=${{ vars.WORKER_APP_NAME }}
          DASHBOARD_APP_NAME=${{ vars.DASHBOARD_APP_NAME }}
          EOF

      - name: Migrate + deploy (fails the job if the migration does not succeed)
        working-directory: deploy/azure
        run: ./02-deploy.sh --image-tag "${{ env.IMAGE_TAG }}"

      - name: Summary
        run: |
          echo "### Deployed \`${{ env.IMAGE_TAG }}\` to production" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "Redeployed an existing, already-pushed tag (no rebuild)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Migration succeeded; api/worker/dashboard rolled forward; post-deploy health + authenticated-proxy checks passed." >> "$GITHUB_STEP_SUMMARY"
