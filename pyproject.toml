[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalops"
version = "0.0.0"
description = "Continuous evaluation and release gating for LLM, RAG, and agent systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sanjyot Amritkar" }]
keywords = ["llm", "evaluation", "ci", "release-gating", "rag", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.scripts]
evalops = "evalops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evalops"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Ruff is our Python tool only; do not let the formatter rewrite Markdown
# (notably docs/ARCHITECTURE.md, which is the product source of truth).
# Alembic migration scripts are generated; only alembic/env.py is hand-written.
extend-exclude = ["*.md", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
